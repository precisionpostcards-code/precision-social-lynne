<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Precision Social | Lynne Reynolds</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div class="eyebrow">PRECISION SOCIAL</div><h1>Welcome, Lynne.</h1><p>Your 10-week story content calendar. Click any scheduled post to open the finished graphic and download it.</p></header><section><div class="section-head"><div><h2>Content Calendar</h2><p>Monday · Wednesday · Friday</p></div><span class="pill">30 POSTS READY</span></div><div id="calendar"></div></section></main><div id="modal" class="modal" onclick="backdrop(event)"><div class="modal-card"><div class="modal-top"><b>READY TO POST</b><button onclick="closePost()">✕</button></div><div class="modal-body"><div class="preview"><img id="image"></div><aside><div id="meta" class="meta"></div><h2 id="title"></h2><button class="download" onclick="downloadPost()">DOWNLOAD STORY IMAGE</button><button id="posted" class="posted" onclick="togglePosted()">MARK POSTED</button><p class="note">Stories don’t need a caption or hashtags—just download the image and post.</p></aside></div></div></div><script src="app.js"></script></body></html>
